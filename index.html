/* ---------- вороги ---------- */
function foeStats(kind, wave){
  // живучість росте квадратично: будь-яка стеля прокачки колись мусить не витримати
  var w2 = wave * wave;
  if (kind === 'alien') return { hp: 16 + wave * 9 + w2 * 1.1, sp: 132 + wave * 8, r: 15, dmg: 11, pts: 14 };
  if (kind === 'elite') return { hp: 80 + wave * 32 + w2 * 4, sp: 62 + wave * 3.2, r: 26, dmg: 20, pts: 45 };
  return { hp: 28 + wave * 14 + w2 * 1.8, sp: 76 + wave * 4.4, r: 18, dmg: 9, pts: 10 };
}
function pickKind(){
  var w = S.wave, r = Math.random();
  if (w >= 4 && r < 0.09 + Math.min(0.12, w * 0.012)) return 'elite';
  if (w >= 2 && r < 0.30 + Math.min(0.34, w * 0.042)) return 'alien';
  return 'zombie';
}
function spawnFoe(){
  if (S.foes.length > 150) return;
  var kind = pickKind(), st = foeStats(kind, S.wave);
  var far = Math.max(W, H) / ZOOM * 0.55 + 60;
  var run = Math.hypot(S.pvx, S.pvy);
  var head = run > 40 ? Math.atan2(S.pvy, S.pvx) : Math.random() * Math.PI * 2;
  var x, y, tries = 0;
  do {
    var a = (Math.random() < 0.66 && run > 40)
      ? head + (Math.random() - 0.5) * 2.4
      : Math.random() * Math.PI * 2;
    x = S.px + Math.cos(a) * far;
    y = S.py + Math.sin(a) * far;
    x = Math.max(st.r + 8, Math.min(ARENA - st.r - 8, x));
    y = Math.max(st.r + 8, Math.min(ARENA - st.r - 8, y));
  } while (Math.hypot(x - S.px, y - S.py) < 220 && ++tries < 14);
  S.foes.push({
    kind:kind, x:x, y:y, hp:st.hp, max:st.hp, sp:st.sp, r:st.r, dmg:st.dmg, pts:st.pts,
    face:Math.atan2(S.py - y, S.px - x), ph:Math.random() * 6.28,
    atk:false, swing:false, flash:0, kx:0, ky:0, wob:Math.random() * 6.28
  });
}

/* ---------- частинки й плями ---------- */
function puff(x, y, n, col, pw, rad){
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = (0.35 + Math.random()) * pw;
    S.fx.push({ x:x, y:y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:0.4 + Math.random() * 0.4, max:0.8, col:col, r:(rad || 3) * (0.5 + Math.random()) });
  }
}
function splat(x, y, r){
  S.decals.push({ x:x, y:y, r:r, s:Math.random() * 100 });
  if (S.decals.length > 150) S.decals.shift();
}

/* ---------- атака ---------- */
function shoot(){
  var st = S.st, base = S.aim;
  for (var i = 0; i < st.n; i++) {
    var off = (i - (st.n - 1) / 2) * st.spread;
    var a = base + off + (Math.random() - 0.5) * 0.05;
    S.shots.push({
      x:S.px + Math.cos(base) * 22, y:S.py + Math.sin(base) * 22,
      vx:Math.cos(a) * st.bspd, vy:Math.sin(a) * st.bspd,
      life:st.blife, dmg:st.dmg, pen:st.pen, hcd:0, r:7 + Math.random() * 2, s:Math.random() * 100
    });
  }
  S.cool = st.rate;
  sfxShot();
}
function swingShard(){
  var st = S.st, hit = 0;
  S.swingT = 0.2;
  for (var j = S.foes.length - 1; j >= 0; j--) {
    var f = S.foes[j];
    var dx = f.x - S.px, dy = f.y - S.py;
    var d = Math.hypot(dx, dy) || 1;
    if (d > st.radius + f.r) continue;
    if (angDiff(Math.atan2(dy, dx), S.aim) > st.arc / 2) continue;
    f.hp -= st.dmg; f.flash = 0.12;
    f.kx += dx / d * S.knock; f.ky += dy / d * S.knock;
    puff(f.x, f.y, 5, '#ffffff', 160, 3);
    splat(f.x, f.y, 8);
    hit++;
    if (f.hp <= 0) killFoe(f, j);
  }
  S.cool = st.rate;
  sfxSwing(hit);
}
function hurtPlayer(dmg){
  if (S.inv > 0) return;
  S.hp -= dmg;
  S.inv = 0.42;
  S.hurt = 0.4;
  S.shake = 13;
  S.flash = 0.4;
  sfxHurt();
  if (S.hp <= 0) { S.hp = 0; gameOver(); }
}
function killFoe(f, i){
  S.foes.splice(i, 1);
  S.kills++;
  S.score += f.pts;
  puff(f.x, f.y, f.kind === 'elite' ? 18 : 10, f.kind === 'alien' ? '#b49ae8' : '#8fbf5c', 210, 4);
  splat(f.x, f.y, f.r * (0.9 + Math.random() * 0.6));
  sfxSplat();
  if (Math.random() < 0.10) S.drops.push({ x:f.x, y:f.y, t:0 });
  if (S.kills > 0 && S.kills % 15 === 0) offerUps();
}

/* ---------- апгрейди ---------- */
function offerUps(){
  var pool = [];
  for (var i = 0; i < UPS.length; i++) {
    var u = UPS[i];
    if (u.w !== 'any' && u.w !== S.wep) continue;
    if ((S.taken[u.id] || 0) >= u.max) continue;
    if (u.ok && !u.ok()) continue;
    pool.push(u);
  }
  if (!pool.length) {
    S.maxHp += 10; S.hp = Math.min(S.maxHp, S.hp + 25);
    S.toast = { text:'Другого дихання', life:1.4 };
    sfxLevel();
    return;
  }
  for (var k = pool.length - 1; k > 0; k--) {
    var j = (Math.random() * (k + 1)) | 0, tmp = pool[k]; pool[k] = pool[j]; pool[j] = tmp;
  }
  S.offers = pool.slice(0, 3);
  var html = '';
  for (var q = 0; q < S.offers.length; q++) {
    var o = S.offers[q];
    var got = S.taken[o.id] || 0;
    html += '<button class="up" type="button" data-i="' + q + '">' +
      '<span class="upnum">' + (q + 1) + '</span>' +
      '<span class="uptext"><span class="uptitle">' + o.title + '</span>' +
      '<span class="updesc">' + o.desc + (got ? ' · вже ' + got + '/' + o.max : '') + '</span></span>' +
    '</button>';
  }
  elUps.innerHTML = html;
  Array.prototype.forEach.call(elUps.querySelectorAll('.up'), function(btn){
    btn.addEventListener('click', function(){ takeUp(parseInt(btn.getAttribute('data-i'), 10)); }, SIG);
  });
  S.mode = 'pick';
  scPick.hidden = false;
  sfxLevel();
}
function takeUp(i){
  if (S.mode !== 'pick') return;
  var o = S.offers[i];
  if (!o) return;
  o.apply();
  S.taken[o.id] = (S.taken[o.id] || 0) + 1;
  S.lvl++;
  S.offers = [];
  scPick.hidden = true;
  S.mode = 'play';
  S.toast = { text:o.title, life:1.2 };
  sfxPickUp();
  syncHud();
}

function update(dt){
  S.t += dt;
  if (S.toast) { S.toast.life -= dt; if (S.toast.life <= 0) S.toast = null; }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 42);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.8);
  if (S.swingT > 0) S.swingT = Math.max(0, S.swingT - dt);
  if (S.mode !== 'play') {
    for (var q = S.fx.length - 1; q >= 0; q--) {
      var ff = S.fx[q]; ff.life -= dt;
      if (ff.life <= 0) S.fx.splice(q, 1);
      else { ff.x += ff.vx * dt; ff.y += ff.vy * dt; ff.vx *= 0.92; ff.vy *= 0.92; }
    }
    return;
  }

  if (S.inv > 0) S.inv -= dt;
  if (S.hurt > 0) S.hurt -= dt;

  S.waveT += dt;
  if (S.waveT > 22) {
    S.waveT = 0; S.wave++;
    S.score += 25 * S.wave;
    S.toast = { text:'Хвиля ' + S.wave, life:1.5 };
    sfxWave();
  }
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    var burst = 1 + Math.min(7, Math.floor(S.wave / 2.5));
    for (var b = 0; b < burst; b++) spawnFoe();
    S.spawnT = Math.max(0.20, 1.45 - S.wave * 0.11);
  }

  var mx = 0, my = 0;
  if (keys.l) mx -= 1;
  if (keys.r) mx += 1;
  if (keys.u) my -= 1;
  if (keys.d) my += 1;
  if (S.joy) {
    var jd = Math.hypot(S.joy.dx, S.joy.dy);
    if (jd > 8) { mx += S.joy.dx / 62; my += S.joy.dy / 62; }
  }
  var ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; ml = 1; }
  var SPD = 214 * S.st.move;
  S.pvx += (mx * SPD - S.pvx) * Math.min(1, dt * 14);
  S.pvy += (my * SPD - S.pvy) * Math.min(1, dt * 14);
  S.px += S.pvx * dt;
  S.py += S.pvy * dt;
  S.px = Math.max(PR + 6, Math.min(ARENA - PR - 6, S.px));
  S.py = Math.max(PR + 6, Math.min(ARENA - PR - 6, S.py));
  S.walk += ml * dt * 11;

  var near = null, nd = 1e9, i, f;
  for (i = 0; i < S.foes.length; i++) {
    f = S.foes[i];
    var d2 = (f.x - S.px) * (f.x - S.px) + (f.y - S.py) * (f.y - S.py);
    if (d2 < nd) { nd = d2; near = f; }
  }
  if (S.aimMouse) {
    var psx = (S.px - S.camX) * ZOOM + W / 2, psy = (S.py - S.camY) * ZOOM + H / 2;
    S.aim = Math.atan2(S.my - psy, S.mx - psx);
  } else if (near) {
    S.aim = angLerp(S.aim, Math.atan2(near.y - S.py, near.x - S.px), Math.min(1, dt * 12));
  } else if (ml > 0.1) {
    S.aim = angLerp(S.aim, Math.atan2(my, mx), Math.min(1, dt * 8));
  }

  S.cool -= dt;
  if (S.cool <= 0) {
    if (S.wep === 'shard') {
      if (near && Math.sqrt(nd) < S.st.radius + 46) swingShard();
    } else if (near || S.aimMouse) shoot();
  }

  var halfW = Math.min(W / (2 * ZOOM), ARENA / 2), halfH = Math.min(H / (2 * ZOOM), ARENA / 2);
  var tx = Math.max(halfW, Math.min(ARENA - halfW, S.px));
  var ty = Math.max(halfH, Math.min(ARENA - halfH, S.py));
  S.camX += (tx - S.camX) * Math.min(1, dt * 7);
  S.camY += (ty - S.camY) * Math.min(1, dt * 7);

  for (i = S.shots.length - 1; i >= 0; i--) {
    var s = S.shots[i];
    s.life -= dt;
    if (s.hcd > 0) s.hcd -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life <= 0 || s.x < 0 || s.y < 0 || s.x > ARENA || s.y > ARENA) {
      if (s.life <= 0) splat(s.x, s.y, s.r * 1.1);
      S.shots.splice(i, 1);
      continue;
    }
    if (s.hcd > 0) continue;
    for (var j = S.foes.length - 1; j >= 0; j--) {
      f = S.foes[j];
      if (Math.hypot(f.x - s.x, f.y - s.y) > f.r + s.r) continue;
      f.hp -= s.dmg;
      f.flash = 0.12;
      var kb = 90 / (1 + f.r * 0.05);
      f.kx += s.vx / Math.max(1, S.st.bspd) * kb; f.ky += s.vy / Math.max(1, S.st.bspd) * kb;
      puff(s.x, s.y, 4, '#ffffff', 130, 2.6);
      splat(s.x, s.y, s.r * 0.9);
      if (s.pen > 0) { s.pen--; s.hcd = 0.07; }
      else S.shots.splice(i, 1);
      sfxPlop();
      if (f.hp <= 0) killFoe(f, j);
      break;
    }
  }

  for (i = S.foes.length - 1; i >= 0; i--) {
    f = S.foes[i];
    if (f.flash > 0) f.flash -= dt;
    var dx = S.px - f.x, dy = S.py - f.y;
    var dist = Math.hypot(dx, dy) || 1;
    f.face = angLerp(f.face, Math.atan2(dy, dx), Math.min(1, dt * 7));

    var reach = f.r + PR + 14;
    if (!f.atk && dist < reach) { f.atk = true; f.swing = true; f.ph = -Math.PI / 2; }
    else if (f.atk && dist > reach + 30) { f.atk = false; f.swing = false; }

    var rate = f.atk ? 6.6 : 5.2;
    f.ph += dt * rate;
    f.wob += dt * 3;

    if (f.swing && f.ph >= Math.PI / 2) {
      f.swing = false;
      if (dist < reach + 18) {
        hurtPlayer(f.dmg + Math.floor(S.wave * 0.5));
        if (S.mode !== 'play') return;
        var pa = Math.atan2(dy, dx);
        S.pvx -= Math.cos(pa) * 210;
        S.pvy -= Math.sin(pa) * 210;
      }
      if (f.atk) { f.ph = -Math.PI / 2; f.swing = true; }
    }

    var lurch = f.atk ? 0.3 : (f.kind === 'alien'
      ? 0.88 + 0.22 * Math.max(0, Math.sin(f.ph))
      : 0.72 + 0.4 * Math.max(0, Math.sin(f.ph)));
    f.x += (dx / dist) * f.sp * lurch * dt;
    f.y += (dy / dist) * f.sp * lurch * dt;

    f.x += f.kx * dt; f.y += f.ky * dt;
    f.kx *= 0.86; f.ky *= 0.86;

    for (var k2 = i - 1; k2 >= 0 && k2 > i - 7; k2--) {
      var o = S.foes[k2];
      var ox = f.x - o.x, oy = f.y - o.y;
      var od = Math.hypot(ox, oy);
      var minD = f.r + o.r;
      if (od > 0.01 && od < minD) {
        var push = (minD - od) * 0.5;
        f.x += ox / od * push; f.y += oy / od * push;
        o.x -= ox / od * push; o.y -= oy / od * push;
      }
    }
    f.x = Math.max(f.r, Math.min(ARENA - f.r, f.x));
    f.y = Math.max(f.r, Math.min(ARENA - f.r, f.y));
  }

  for (i = S.drops.length - 1; i >= 0; i--) {
    var dr = S.drops[i];
    dr.t += dt;
    if (dr.t > 16) { S.drops.splice(i, 1); continue; }
    if (Math.hypot(dr.x - S.px, dr.y - S.py) < PR + 16) {
      S.hp = Math.min(S.maxHp, S.hp + 18);
      S.drops.splice(i, 1);
      puff(dr.x, dr.y, 8, '#7fd07a', 150, 3);
      sfxHeal();
    }
  }

  for (i = S.fx.length - 1; i >= 0; i--) {
    var p = S.fx[i];
    p.life -= dt;
    if (p.life <= 0) { S.fx.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
  }
}

/* ---------- малювання ---------- */
function sx(x){ return x - S.camX + W / 2; }
function sy(y){ return y - S.camY + H / 2; }

function drawGround(){
  g.fillStyle = '#171c1a';
  g.fillRect(-W, -H, W * 3, H * 3);
  var step = 110;
  var x0 = Math.floor((S.camX - W / 2) / step) * step;
  var y0 = Math.floor((S.camY - H / 2) / step) * step;
  var x, y;
  for (x = x0; x < S.camX + W / 2 + step; x += step) {
    for (y = y0; y < S.camY + H / 2 + step; y += step) {
      var h1 = hash2(x * 0.013 + y * 0.029);
      g.fillStyle = h1 > 0.5 ? '#1b2220' : '#151b19';
      g.fillRect(sx(x), sy(y), step, step);
      if (h1 > 0.86) {
        g.fillStyle = 'rgba(94,109,58,0.18)';
        g.beginPath();
        g.arc(sx(x + 30 + h1 * 40), sy(y + 20 + h1 * 50), 14 + h1 * 16, 0, 6.2832);
        g.fill();
      }
    }
  }
  g.strokeStyle = 'rgba(242,237,227,0.035)';
  g.lineWidth = 1;
  for (x = x0; x < S.camX + W / 2 + step; x += step) {
    g.beginPath(); g.moveTo(Math.round(sx(x)) + 0.5, -H); g.lineTo(Math.round(sx(x)) + 0.5, H * 2); g.stroke();
  }
  for (y = y0; y < S.camY + H / 2 + step; y += step) {
    g.beginPath(); g.moveTo(-W, Math.round(sy(y)) + 0.5); g.lineTo(W * 2, Math.round(sy(y)) + 0.5); g.stroke();
  }

  g.fillStyle = '#0a0d14';
  var L = sx(0), T = sy(0), R = sx(ARENA), B = sy(ARENA);
  if (L > -W) g.fillRect(-W, -H, L + W, H * 3);
  if (T > -H) g.fillRect(-W, -H, W * 3, T + H);
  if (R < W * 2) g.fillRect(R, -H, W * 2, H * 3);
  if (B < H * 2) g.fillRect(-W, B, W * 3, H * 2);
  g.strokeStyle = 'rgba(245,199,74,0.30)';
  g.lineWidth = 3;
  g.strokeRect(L, T, R - L, B - T);
  g.strokeStyle = 'rgba(232,72,58,0.25)';
  g.setLineDash([16, 12]);
  g.lineWidth = 2;
  g.strokeRect(L - 7, T - 7, R - L + 14, B - T + 14);
  g.setLineDash([]);
}

function blob(X, Y, r, seed){
  g.beginPath();
  for (var a = 0; a < 10; a++) {
    var ang = a / 10 * Math.PI * 2;
    var rr = r * (0.72 + hash2(seed + a * 1.7) * 0.6);
    var px = X + Math.cos(ang) * rr, py = Y + Math.sin(ang) * rr;
    if (a === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath(); g.fill();
}
function drawDecals(){
  for (var i = 0; i < S.decals.length; i++) {
    var d = S.decals[i];
    var X = sx(d.x), Y = sy(d.y);
    if (X < -60 || Y < -60 || X > W + 60 || Y > H + 60) continue;
    g.fillStyle = 'rgba(238,238,232,0.30)';
    blob(X, Y, d.r, d.s);
  }
}

function drawZombie(f){
  var X = sx(f.x), Y = sy(f.y), th = Math.sin(f.ph);
  var amp = f.atk ? 13 : 6;
  g.save();
  g.translate(X, Y);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.beginPath(); g.ellipse(2, 4, f.r * 1.02, f.r * 0.9, 0, 0, 6.2832); g.fill();
  g.rotate(f.face);
  var big = f.kind === 'elite' ? 1.45 : 1;
  var hip = th * amp * big;
  g.strokeStyle = '#2f4423'; g.lineWidth = 6 * big; g.lineCap = 'round';
  [-1, 1].forEach(function(s2){
    g.beginPath();
    g.moveTo(hip * 0.6 - 2, s2 * 6 * big);
    g.lineTo(hip * 0.6 - 10 * big - Math.max(0, -th) * 5, s2 * (11 * big + Math.sin(f.wob + s2) * 2));
    g.stroke();
  });
  g.fillStyle = f.flash > 0 ? '#e9f5d6' : '#456530';
  rrect2(hip - 9 * big, -11 * big, 21 * big, 22 * big, 8 * big); g.fill();
  g.fillStyle = f.flash > 0 ? '#f2fbe4' : '#54793a';
  rrect2(-th * 3 * big - 14 * big, -12 * big, 22 * big, 24 * big, 8 * big); g.fill();
  g.strokeStyle = '#4f7136'; g.lineWidth = 5.5 * big;
  [-1, 1].forEach(function(s2){
    g.beginPath();
    g.moveTo(-4 * big, s2 * 10 * big);
    g.quadraticCurveTo(8 * big, s2 * 13 * big, 17 * big + th * 2, s2 * 6 * big);
    g.stroke();
  });
  g.fillStyle = f.flash > 0 ? '#ffffff' : '#79a252';
  g.beginPath(); g.arc(-th * 2 * big + 2 * big, 0, 9.5 * big, 0, 6.2832); g.fill();
  g.fillStyle = '#1b2414';
  g.beginPath(); g.arc(6 * big, -4 * big, 2.1 * big, 0, 6.2832); g.fill();
  g.beginPath(); g.arc(6 * big, 4 * big, 2.1 * big, 0, 6.2832); g.fill();
  g.restore();
  hpBar(X, Y - f.r - 10, f);
}
function drawAlien(f){
  var X = sx(f.x), Y = sy(f.y), th = Math.sin(f.ph);
  var amp = f.atk ? 14 : 7;
  g.save();
  g.translate(X, Y);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.beginPath(); g.ellipse(2, 4, f.r, f.r * 0.86, 0, 0, 6.2832); g.fill();
  g.rotate(f.face);
  var hip = th * amp;
  g.strokeStyle = '#4b3f76'; g.lineWidth = 4.5; g.lineCap = 'round';
  [-1, 1].forEach(function(s2){
    g.beginPath();
    g.moveTo(hip * 0.6 - 2, s2 * 5);
    g.lineTo(hip * 0.6 - 11, s2 * (10 + Math.sin(f.wob + s2 * 2) * 2.5));
    g.stroke();
  });
  g.fillStyle = f.flash > 0 ? '#f4eaff' : '#5d4f8e';
  rrect2(hip - 8, -9, 18, 18, 7); g.fill();
  g.fillStyle = f.flash > 0 ? '#ffffff' : '#7565ab';
  rrect2(-th * 3 - 12, -8, 17, 16, 6); g.fill();
  g.strokeStyle = '#6a5a9d'; g.lineWidth = 3.4;
  [-1, 1].forEach(function(s2){
    g.beginPath();
    g.moveTo(-3, s2 * 7);
    g.quadraticCurveTo(8, s2 * 12, 18 + th * 2, s2 * 4);
    g.stroke();
  });
  g.fillStyle = f.flash > 0 ? '#ffffff' : '#a898d8';
  g.beginPath(); g.ellipse(-th * 2 + 3, 0, 12, 10, 0, 0, 6.2832); g.fill();
  g.fillStyle = '#100d1c';
  g.beginPath(); g.ellipse(7, -5, 4.4, 3.1, -0.5, 0, 6.2832); g.fill();
  g.beginPath(); g.ellipse(7, 5, 4.4, 3.1, 0.5, 0, 6.2832); g.fill();
  g.restore();
  hpBar(X, Y - f.r - 10, f);
}
function hpBar(X, Y, f){
  if (f.hp >= f.max) return;
  var w = f.r * 1.9, k = Math.max(0, f.hp / f.max);
  g.fillStyle = 'rgba(8,10,18,0.66)';
  g.fillRect(X - w / 2, Y, w, 4);
  g.fillStyle = k > 0.45 ? '#8fbf5c' : '#e8483a';
  g.fillRect(X - w / 2, Y, w * k, 4);
}

function drawPlayer(){
  var X = sx(S.px), Y = sy(S.py);
  var wk = Math.sin(S.walk);
  g.save();
  g.translate(X, Y);
  g.fillStyle = 'rgba(0,0,0,0.4)';
  g.beginPath(); g.ellipse(2, 4, PR * 1.25, PR * 1.05, 0, 0, 6.2832); g.fill();
  g.rotate(S.aim);
  if (S.inv > 0 && Math.floor(S.t * 20) % 2 === 0) g.globalAlpha = 0.45;

  // хвіст
  g.save();
  g.rotate(wk * 0.28);
  g.fillStyle = 'rgba(216,124,56,0.92)';
  g.beginPath();
  g.moveTo(-14, 0); g.lineTo(-33, -13);
  g.quadraticCurveTo(-24, 0, -33, 13);
  g.closePath(); g.fill();
  g.restore();

  // ноги
  g.strokeStyle = '#c99c46'; g.lineWidth = 5; g.lineCap = 'round';
  [-1, 1].forEach(function(s2){
    var ph = S.walk + (s2 > 0 ? Math.PI : 0);
    g.beginPath();
    g.moveTo(-2, s2 * 9);
    g.lineTo(-2 + Math.cos(ph) * 7, s2 * (15 + Math.abs(Math.sin(ph)) * 3));
    g.stroke();
    g.fillStyle = '#f2ede3';
    g.beginPath();
    g.ellipse(-2 + Math.cos(ph) * 9, s2 * (17 + Math.abs(Math.sin(ph)) * 3), 5, 3.4, 0, 0, 6.2832);
    g.fill();
  });

  // тіло
  var bg = g.createLinearGradient(0, -14, 0, 14);
  bg.addColorStop(0, '#8c8c3e'); bg.addColorStop(0.5, '#d3ab55'); bg.addColorStop(1, '#8c8c3e');
  g.fillStyle = bg;
  g.beginPath(); g.ellipse(0, 0, 21, 13, 0, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(216,124,56,0.85)';
  [-1, 1].forEach(function(s2){
    g.save(); g.translate(2, s2 * 10); g.rotate(s2 * (0.5 + wk * 0.2));
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(8, s2 * 7, -3, s2 * 10);
    g.quadraticCurveTo(-4, s2 * 4, 0, 0); g.fill();
    g.restore();
  });
  // риб'яча морда
  g.fillStyle = '#e3c072';
  g.beginPath(); g.ellipse(16, 0, 8.5, 8.5, 0, 0, 6.2832); g.fill();
  [-1, 1].forEach(function(s2){
    g.fillStyle = '#f7f3ea';
    g.beginPath(); g.arc(18, s2 * 5.4, 3.4, 0, 6.2832); g.fill();
    g.fillStyle = '#14161f';
    g.beginPath(); g.arc(19.3, s2 * 5.7, 1.7, 0, 6.2832); g.fill();
  });

  // лиса чоловіча голова згори
  g.fillStyle = 'rgba(0,0,0,0.22)';
  g.beginPath(); g.ellipse(3.6, 1.6, 10, 9, 0, 0, 6.2832); g.fill();
  g.fillStyle = '#d8ac82';
  g.beginPath(); g.ellipse(4, -8.6, 2.6, 3.4, 0, 0, 6.2832); g.fill();
  g.beginPath(); g.ellipse(4, 8.6, 2.6, 3.4, 0, 0, 6.2832); g.fill();
  var sk = g.createRadialGradient(6, -3, 1, 4, 0, 11);
  sk.addColorStop(0, '#f6d5ad'); sk.addColorStop(0.55, '#e3b98e'); sk.addColorStop(1, '#c79468');
  g.fillStyle = sk;
  g.beginPath(); g.ellipse(4, 0, 9.6, 8.6, 0, 0, 6.2832); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.40)';
  g.beginPath(); g.ellipse(7.4, -2.6, 3.2, 2.1, -0.5, 0, 6.2832); g.fill();
  g.strokeStyle = '#7a5433'; g.lineWidth = 1.25; g.lineCap = 'round';
  for (var hh = 0; hh < 4; hh++) {
    var hy = (hh - 1.5) * 3.1;
    var sway = Math.sin(S.t * 7 + hh * 1.4) * 2.2;
    g.beginPath();
    g.moveTo(2.5, hy);
    g.quadraticCurveTo(-2, hy + sway * 0.6, -5.5, hy + sway);
    g.stroke();
  }

  // зброя
  if (S.wep === 'shard') {
    g.save();
    g.rotate(S.swingT > 0 ? (S.swingT / 0.2 - 0.5) * 1.1 : Math.sin(S.t * 3) * 0.08);
    g.fillStyle = 'rgba(126,196,150,0.85)';
    g.beginPath();
    g.moveTo(17, -4.5); g.lineTo(31, -6); g.lineTo(34, -2.5); g.lineTo(30, 0);
    g.lineTo(35, 2); g.lineTo(31, 6); g.lineTo(17, 4.5);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(230,255,240,0.75)'; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(20, -2.5); g.lineTo(29, -3.5); g.moveTo(20, 2.5); g.lineTo(28, 3.5); g.stroke();
    g.fillStyle = '#4e7a58';
    rrect2(14, -5.6, 6, 11.2, 2.4); g.fill();
    g.restore();
  } else {
    g.fillStyle = '#2b3140';
    rrect2(18, -3.6, 20, 7.2, 3); g.fill();
    g.fillStyle = '#3c4353';
    rrect2(30, -5, 7, 10, 3); g.fill();
    if (S.cool > S.st.rate - 0.06) {
      g.fillStyle = 'rgba(255,255,255,0.85)';
      blob(42, 0, 8, 7);
    }
  }
  g.globalAlpha = 1;
  g.restore();

  // слід від замаху розочкою
  if (S.wep === 'shard' && S.swingT > 0) {
    var k = S.swingT / 0.2;
    g.save();
    g.globalAlpha = k * 0.5;
    var gr = g.createRadialGradient(X, Y, S.st.radius * 0.35, X, Y, S.st.radius);
    gr.addColorStop(0, 'rgba(255,255,255,0)');
    gr.addColorStop(0.7, 'rgba(210,255,225,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(X, Y);
    g.arc(X, Y, S.st.radius, S.aim - S.st.arc / 2, S.aim + S.st.arc / 2);
    g.closePath(); g.fill();
    g.restore();
  }
}

function draw(){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  if (S.shake > 0.2 && !REDUCE) g.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);

  /* світ — зі збільшенням; інтерфейс поверх нього малюється без нього */
  g.save();
  g.translate(W / 2, H / 2); g.scale(ZOOM, ZOOM); g.translate(-W / 2, -H / 2);

  drawGround();
  drawDecals();

  var i;
  for (i = 0; i < S.drops.length; i++) {
    var d = S.drops[i];
    var X = sx(d.x), Y = sy(d.y);
    var pulse = 1 + Math.sin(S.t * 5 + i) * 0.1;
    g.globalAlpha = (d.t > 12 && Math.floor(d.t * 6) % 2 === 0) ? 0.35 : 1;
    g.fillStyle = '#123021';
    g.beginPath(); g.arc(X, Y, 12 * pulse, 0, 6.2832); g.fill();
    g.fillStyle = '#7fd07a';
    g.fillRect(X - 7 * pulse, Y - 2.4 * pulse, 14 * pulse, 4.8 * pulse);
    g.fillRect(X - 2.4 * pulse, Y - 7 * pulse, 4.8 * pulse, 14 * pulse);
    g.globalAlpha = 1;
  }

  var order = S.foes.slice();
  order.sort(function(a, b){ return a.y - b.y; });
  var drewPlayer = false;
  for (i = 0; i < order.length; i++) {
    var f = order[i];
    if (!drewPlayer && f.y > S.py) { drawPlayer(); drewPlayer = true; }
    var X2 = sx(f.x), Y2 = sy(f.y);
    if (X2 < -70 || Y2 < -70 || X2 > W + 70 || Y2 > H + 70) continue;
    if (f.kind === 'alien') drawAlien(f); else drawZombie(f);
  }
  if (!drewPlayer) drawPlayer();

  for (i = 0; i < S.shots.length; i++) {
    var s = S.shots[i];
    var SX = sx(s.x), SY = sy(s.y);
    g.fillStyle = 'rgba(255,255,255,0.25)';
    blob(SX - s.vx * 0.012, SY - s.vy * 0.012, s.r * 0.8, s.s + 3);
    g.fillStyle = '#ffffff';
    blob(SX, SY, s.r, s.s);
  }

  for (i = 0; i < S.fx.length; i++) {
    var p = S.fx[i];
    g.globalAlpha = Math.max(0, p.life / p.max);
    g.fillStyle = p.col;
    g.beginPath(); g.arc(sx(p.x), sy(p.y), p.r, 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
  g.restore();

  /* екранний шар */
  if (S.joy) {
    g.strokeStyle = 'rgba(242,237,227,0.22)'; g.lineWidth = 2;
    g.beginPath(); g.arc(S.joy.ox, S.joy.oy, 62, 0, 6.2832); g.stroke();
    g.fillStyle = 'rgba(245,199,74,0.32)';
    g.beginPath(); g.arc(S.joy.ox + S.joy.dx, S.joy.oy + S.joy.dy, 22, 0, 6.2832); g.fill();
  }
  if (S.flash > 0) {
    g.fillStyle = 'rgba(232,72,58,' + (S.flash * 0.33).toFixed(3) + ')';
    g.fillRect(0, 0, W, H);
  }
  var lowHp = S.hp / S.maxHp;
  if (lowHp < 0.35 && S.mode === 'play') {
    var pul = (0.35 - lowHp) / 0.35 * (0.2 + 0.14 * Math.sin(S.t * 7));
    var rg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.24, W / 2, H / 2, Math.max(W, H) * 0.62);
    rg.addColorStop(0, 'rgba(232,72,58,0)');
    rg.addColorStop(1, 'rgba(232,72,58,' + Math.max(0, pul).toFixed(3) + ')');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(6,8,16,0)'); vg.addColorStop(1, 'rgba(6,8,16,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  if (S.toast) {
    g.save();
    g.globalAlpha = Math.min(1, S.toast.life / 0.4) * Math.min(1, (1.5 - S.toast.life) / 0.12);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var fsz = Math.max(20, Math.min(48, W * 0.085));
    g.font = '700 ' + fsz.toFixed(0) + 'px Unbounded, Trebuchet MS, sans-serif';
    var ty = H * 0.26 - (1.5 - S.toast.life) * 22;
    g.lineWidth = fsz * 0.16; g.strokeStyle = 'rgba(8,10,18,0.8)';
    g.strokeText(S.toast.text, W / 2, ty);
    g.fillStyle = '#f5c74a';
    g.fillText(S.toast.text, W / 2, ty);
    g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    g.restore();
  }
  g.restore();
}

/* ---------- інтерфейс ---------- */
var elWave = document.getElementById('k2Wave'), elScore = document.getElementById('k2Score'),
    elBest = document.getElementById('k2Best'), elHp = document.getElementById('k2Hp'),
    elLv = document.getElementById('k2Lv'), elUps = document.getElementById('k2Ups'),
    scStart = document.getElementById('k2Start'), scOver = document.getElementById('k2Over'),
    scPause = document.getElementById('k2Paused'), scPick = document.getElementById('k2Pick'),
    bSound = document.getElementById('k2Sound'), bPause = document.getElementById('k2Pause');

var LINES = [
  'Карась відбивався до останнього плавця.',
  'Тазів було більше, ніж слюті.',
  'Прибульці навіть не вибачились.',
  'Волосини вціліли. Решта — ні.'
];

function syncHud(){
  elWave.textContent = S.wave;
  elScore.textContent = S.score;
  elBest.textContent = best;
  var k = Math.max(0, S.hp / S.maxHp);
  elHp.style.width = (k * 100).toFixed(1) + '%';
  elHp.style.background = k > 0.55 ? '#8fbf5c' : (k > 0.28 ? '#f5c74a' : '#e8483a');
  elLv.textContent = WNAME[S.wep] + ' ' + (S.lvl + 1);
}
function syncSoundBtn(){ bSound.textContent = sound ? 'Звук: увімк.' : 'Звук: вимк.'; }

function start(wep){
  var keep = best;
  reset(wep);
  best = keep;
  S.mode = 'play';
  scStart.hidden = true; scOver.hidden = true; scPause.hidden = true; scPick.hidden = true;
  bPause.textContent = 'Пауза';
  audioInit();
  if (A.music) A.music.gain.value = 0.46;
  musicStart();
  syncHud();
}
function gameOver(){
  S.mode = 'over';
  S.shake = 24;
  S.toast = null;
  scPick.hidden = true;
  musicStop();
  sfxOver();
  document.getElementById('k2rWave').textContent = S.wave;
  document.getElementById('k2rKills').textContent = S.kills;
  document.getElementById('k2rScore').textContent = S.score;
  document.getElementById('k2Line').textContent = LINES[(Math.random() * LINES.length) | 0];
  var note = document.getElementById('k2Note');
  if (S.score > best) {
    best = S.score;
    try { localStorage.setItem('karas2.best', String(best)); } catch(e){}
    note.textContent = 'Новий рекорд — ' + best + '.';
  } else {
    note.textContent = 'Рекорд — ' + best + '. Не дотягнув ' + (best - S.score) + '.';
  }
  scOver.hidden = false;
  syncHud();
}
function togglePause(){
  if (S.mode === 'play') {
    S.mode = 'pause'; scPause.hidden = false; bPause.textContent = 'Далі';
    if (A.music) A.music.gain.value = 0;
  } else if (S.mode === 'pause') {
    S.mode = 'play'; scPause.hidden = true; bPause.textContent = 'Пауза';
    ac();
    if (A.music) A.music.gain.value = 0.46;
  }
}
document.getElementById('k2WBlob').addEventListener('click', function(){ start('blob'); }, SIG);
document.getElementById('k2WShard').addEventListener('click', function(){ start('shard'); }, SIG);
document.getElementById('k2Again').addEventListener('click', function(){ start(S.wep); }, SIG);
document.getElementById('k2Swap').addEventListener('click', function(){
  scOver.hidden = true; scStart.hidden = false; S.mode = 'menu';
}, SIG);
document.getElementById('k2Resume').addEventListener('click', togglePause, SIG);
bPause.addEventListener('click', togglePause, SIG);
bSound.addEventListener('click', function(){
  setSound(!sound);
  syncSoundBtn();
  if (sound && S.mode === 'play') musicStart();
}, SIG);
syncSoundBtn();

/* ---------- цикл ---------- */
var last = 0, hudT = 0, rafId = 0, dead = false;
function frame(now){
  if (dead) return;
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  if (S.mode === 'play') musicTick();
  draw();
  hudT += dt;
  if (hudT > 0.08) { hudT = 0; syncHud(); }
  rafId = requestAnimationFrame(frame);
}

resize();
syncHud();
rafId = requestAnimationFrame(frame);

function stop(){
  if (dead) return;
  dead = true;
  if (rafId) cancelAnimationFrame(rafId);
  musicStop();
  try { if (AC) AC.close(); } catch(e){}
  AC = null;
  A.master = A.music = A.sfx = A.comp = A.noise = null;
  AB.abort();
  root.innerHTML = '';
}

return { stop: stop };
}

/* ---------- мініатюра ---------- */
function thumbKaras2(c, w, h, t){
  c.fillStyle = '#171c1a'; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(242,237,227,0.05)'; c.lineWidth = 1;
  for (var x = 0; x < w; x += 26) { c.beginPath(); c.moveTo(x + .5, 0); c.lineTo(x + .5, h); c.stroke(); }
  for (var y = 0; y < h; y += 26) { c.beginPath(); c.moveTo(0, y + .5); c.lineTo(w, y + .5); c.stroke(); }

  function bl(X, Y, r, sd){
    c.beginPath();
    for (var a = 0; a < 9; a++) {
      var an = a / 9 * Math.PI * 2;
      var rr = r * (0.72 + (Math.abs(Math.sin((sd + a) * 12.9) * 43758.5) % 1) * 0.55);
      var px = X + Math.cos(an) * rr, py = Y + Math.sin(an) * rr;
      if (a === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
  }

  c.fillStyle = 'rgba(238,238,232,0.22)';
  for (var s = 0; s < 7; s++) bl(w * (0.15 + (s * 0.13) % 0.75), h * (0.2 + (s * 0.29) % 0.7), h * 0.07, s * 3.1);

  var cx = w * 0.5, cy = h * 0.54, R = Math.min(w, h);
  for (var i = 0; i < 6; i++) {
    var ang = t * 0.5 + i * (Math.PI * 2 / 6);
    var dd = R * (0.40 - 0.07 * Math.sin(t * 0.9 + i));
    var ex = cx + Math.cos(ang) * dd, ey = cy + Math.sin(ang) * dd * 0.72;
    var th = Math.sin(t * 6 + i * 1.3);
    c.save(); c.translate(ex, ey); c.rotate(Math.atan2(cy - ey, cx - ex));
    var alien = i % 2 === 1;
    c.fillStyle = alien ? '#5d4f8e' : '#456530';
    c.fillRect(th * 5 - 5, -5, 11, 10);
    c.fillStyle = alien ? '#a898d8' : '#79a252';
    c.beginPath(); c.arc(-th * 1.5 + 2, 0, alien ? 6 : 5, 0, 6.2832); c.fill();
    c.restore();
  }
  c.save(); c.translate(cx, cy); c.rotate(Math.sin(t * 0.7) * 0.5);
  c.fillStyle = 'rgba(216,124,56,0.9)';
  c.beginPath(); c.moveTo(-8, 0); c.lineTo(-20, -8); c.quadraticCurveTo(-14, 0, -20, 8); c.closePath(); c.fill();
  var bg = c.createLinearGradient(0, -9, 0, 9);
  bg.addColorStop(0, '#8c8c3e'); bg.addColorStop(0.5, '#d3ab55'); bg.addColorStop(1, '#8c8c3e');
  c.fillStyle = bg;
  c.beginPath(); c.ellipse(0, 0, 13, 8, 0, 0, 6.2832); c.fill();
  c.fillStyle = '#e3b98e';
  c.beginPath(); c.ellipse(2, 0, 6, 5.4, 0, 0, 6.2832); c.fill();
  c.strokeStyle = '#7a5433'; c.lineWidth = 1;
  for (var hh = 0; hh < 3; hh++) {
    c.beginPath(); c.moveTo(1, (hh - 1) * 2);
    c.quadraticCurveTo(-2, (hh - 1) * 2 + Math.sin(t * 7 + hh), -4, (hh - 1) * 2 + Math.sin(t * 7 + hh) * 1.6);
    c.stroke();
  }
  c.fillStyle = '#2b3140'; c.fillRect(11, -2, 13, 4);
  c.fillStyle = '#ffffff';
  for (var b2 = 0; b2 < 3; b2++) bl(24 + ((t * 120 + b2 * 34) % 70), 0, 4.5, b2 * 5.3);
  c.restore();
}

})();
</script>
